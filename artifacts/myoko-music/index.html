<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <title>Myoko Music</title>

    <!-- Search engine description -->
    <meta
      name="description"
      content="Myoko Music — discover and connect with music through keychains."
    />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph: Discord, Messenger, Facebook, etc. -->
    <meta property="og:title" content="Myoko Music" />

    <meta
      property="og:description"
      content="Myoko Music — discover and connect with music through keychains."
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://myokomusic.pages.dev/"
    />

    <meta
      property="og:image"
      content="https://myokomusic.pages.dev/myoko-music.png"
    />

    <meta
      property="og:image:alt"
      content="Myoko Music"
    />

    <!-- Social media preview -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Myoko Music"
    />

    <meta
      name="twitter:description"
      content="Myoko Music — discover and connect with music through keychains."
    />

    <meta
      name="twitter:image"
      content="https://myokomusic.pages.dev/myoko-music.png"
    />

    <!-- Browser tab icon -->
    <link
      rel="icon"
      type="image/png"
      href="/myoko-music.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

  <body>
    <div id="root"></div>
